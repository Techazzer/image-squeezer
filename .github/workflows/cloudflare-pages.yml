name: Aeroniqx checks and deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: aeroniqx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Test, build, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      # This static site builds with Node's standard library. The older React
      # dependencies are not required to build the complete production site.
      - name: Test calculations and existing embed settings
        run: npm test

      - name: Build the complete site
        run: npm run build

      - name: Verify original routes, assets, and integration
        run: node scripts/check-build.mjs

      # Pull requests only validate. Only trusted code on main receives credentials.
      - name: Install pinned Cloudflare CLI
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm ci --prefix deployment/cli --no-fund --no-audit

      - name: Deploy and verify Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'production' }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/deploy-cloudflare.mjs
